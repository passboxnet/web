name: Release

# A tag v* builds the web vault and publishes passbox-web-<version>.tar.gz
# with SHA256SUMS and a build provenance attestation. passboxnet/server's
# image embeds this archive at a fixed version.

on:
  push:
    tags: ["v*"]
  # Publishes the release of an existing tag again, e.g. when its push did
  # not start this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, e.g. v0.1.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/release-web.mjs "$TAG"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --title "$TAG" --generate-notes --verify-tag
