name: Release

# A tag v* builds the web vault and publishes passbox-web-<version>.tar.gz
# with SHA256SUMS and a build provenance attestation. passbox-server's
# image embeds this archive at a fixed version.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/release-web.mjs "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
