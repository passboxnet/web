name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Same rule as .githooks/commit-msg: no AI attribution lines.
      - run: |
          if git log --format=%B "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}" \
            | grep -iE '^(co-authored-by:.*(anthropic|claude)|claude-session:)|generated with \[claude code\]|claude\.ai/code/session_'; then
            echo "::error::Remove the attribution lines above from the commit messages."
            exit 1
          fi

  web:
    name: Web vault
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/dist

  e2e:
    name: End-to-end
    needs: web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: passbox
          POSTGRES_PASSWORD: passbox
          POSTGRES_DB: passbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U passbox -d passbox" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A superuser; e2e/database.sh creates a database per test server.
      PASSBOX_E2E_DATABASE_URL: postgres://passbox:passbox@localhost:5432/passbox
      PASSBOX_SERVER_BIN: ${{ github.workspace }}/server/target/debug/passbox-server
      PBX_BIN: ${{ github.workspace }}/cli/target/debug/pbx
    steps:
      - uses: actions/checkout@v5
      # The server and the CLI the web vault is tested against.
      - uses: actions/checkout@v5
        with:
          repository: passboxnet/passbox-server
          path: server
      - uses: actions/checkout@v5
        with:
          repository: passboxnet/passbox-cli
          path: cli
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            cli
      - run: cargo build --locked --manifest-path server/Cargo.toml
        env:
          SQLX_OFFLINE: "true"
      - run: cargo build --locked --manifest-path cli/Cargo.toml
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @passbox/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results
