<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Acme · Create account</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f6f7f9;
        color: #1c2024;
        margin: 0;
      }
      main {
        max-width: 360px;
        margin: 72px auto;
        padding: 28px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 20px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        display: block;
        box-sizing: border-box;
        width: 100%;
        height: 38px;
        margin-bottom: 16px;
        padding: 0 10px;
        font-size: 14px;
        border: 1px solid #c9ced6;
        border-radius: 8px;
      }
      button {
        width: 100%;
        height: 38px;
        border: 0;
        border-radius: 8px;
        background: #1f2937;
        color: #fff;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Create your Acme account</h1>
      <!-- No autocomplete hints: Passbox must infer the new-password fields. -->
      <form method="post" action="/welcome">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" />
        <label for="new">Password</label>
        <input id="new" name="password" type="password" />
        <label for="confirm">Repeat password</label>
        <input id="confirm" name="confirm" type="password" />
        <button type="submit">Create account</button>
      </form>
    </main>
  </body>
</html>
